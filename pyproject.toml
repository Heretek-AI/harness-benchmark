[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-benchmark"
version = "0.1.0"
description = "Automated matrix benchmark suite for AI coding harnesses (Claude Code, Antigravity, Gemini CLI, OpenCode, DeepSeek), Model Context Protocol (MCP) servers, and agent plugins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "ai-agents",
    "coding-agents",
    "mcp",
    "model-context-protocol",
    "claude-code",
    "antigravity",
    "gemini-cli",
    "deepseek",
    "opencode",
    "benchmark",
    "coder-eval",
    "terminal-bench",
    "llm-eval",
    "litellm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Heretek-AI/harness-benchmark"
Repository = "https://github.com/Heretek-AI/harness-benchmark"
Issues = "https://github.com/Heretek-AI/harness-benchmark/issues"
Documentation = "https://github.com/Heretek-AI/harness-benchmark#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
harness-benchmark = "run_benchmark:main"

[tool.setuptools.packages.find]
include = ["agents*", "benchmarks*", "mcp*", "metrics*", "plugins*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"