name: Benchmark Report

on:
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-pr-comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download benchmark artifacts
        uses: actions/github-script@v7
        with:
          script: |
            // We can't easily pull artifacts cross-workflow without
            // actions/download-artifact@4 on a workflow_run trigger
            // because the source run's artifacts are still accessible
            // for 90 days. Skip the heavy lifting here and rely on the
            // benchmark.yml report job to upload a single summary
            // artifact that downstream consumers can fetch.
            core.info('benchmark-report: deferring to the main workflow summary')